name: Manual workflow

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Manual workflow message
        if: github.event_name == 'workflow_dispatch'
        run: echo "The workflow was started manually!"

      - name: Main branch push message
        if: github.event_name == 'push'
        run: echo "Something has been pushed to main!"

      - name: Pull request message
        if: github.event_name == 'pull_request'
        run: echo "A pull request has been made"

      - run: docker build -t acraiacademy26.azurecr.io/team-c-pending-backend:${{ github.sha }} .
      - run: echo "${{ secrets.ACR_PASSWORD }}" | docker login -u TeamCPendingBackendPusher --password-stdin acraiacademy26.azurecr.io
      - run: docker push acraiacademy26.azurecr.io/team-c-pending-backend:${{ github.sha }}
 
