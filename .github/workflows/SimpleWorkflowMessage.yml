name: Backend CI

# This workflow is a manual dispatch that is triggered by an action, push or pull request
# It checks out the code, prints messages based on the event type, and builds and pushes a Docker image.
on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# These are all the different jobs that will run throughout this workflow
jobs:
  lint-test:
    # This runs on ubuntu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # Message for manual workflow
      - name: Manual workflow message
        if: github.event_name == 'workflow_dispatch'
        run: echo "The workflow was started manually!"

      # Message for pushes to main branch
      - name: Main branch push message
        if: github.event_name == 'push'
        run: echo "Something has been pushed to main!"

      # Message for pull requests
      - name: Pull request message
        if: github.event_name == 'pull_request'
        run: echo "A pull request has been made"

  docker-build:
    needs: lint-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Build Docker image
      - name: Build Docker image
        run: docker build -t acraiacademy26.azurecr.io/team-c-pending-backend:${{ github.sha }} .

      # Push to registry only on main branch pushes
      - name: Push Docker image to Azure Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push acraiacademy26.azurecr.io/team-c-pending-backend:${{ github.sha }}
