name: Manual workflow

# This workflow is a manual dispatch that is triggered by an action, push or pull request
# It checks out the code, prints messages based on the event type, and builds and pushes a Docker image.
on:
  workflow_dispatch:
  # When a push or pull request is made to the main branch
  push:
    branches:
      - main

  pull_request:


# This is all the different jobs that will run throughout this workflow
jobs:
  notify:
  #This runs on ubuntu
    runs-on: ubuntu-latest

    #General permission of reading the repository contents
    permissions:
      contents: read
    
    steps:
    # Steps to execute in this job
      - name: Checkout code
        uses: actions/checkout@v4
        
        # This step checks out the repository code so that it can be used in subsequent steps
        #If the workflow was manually triggered this message is shown
      - name: Manual workflow message
        if: github.event_name == 'workflow_dispatch'
        run: echo "The workflow was started manually!"
        
      #Message for pushes to main branch
      - name: Main branch push message
        if: github.event_name == 'push'
        run: echo "Something has been pushed to main!"

      #Message for pull requests
      - name: Pull request message
        if: github.event_name == 'pull_request'
        run: echo "A pull request has been made"

      # Build and push Docker image to the azure container registery 
      - run: docker build -t acraiacademy26.azurecr.io/team-c-pending-backend:${{ github.sha }} .
      - run: echo "${{ secrets.ACR_PASSWORD }}" | docker login -u TeamCPendingBackendPusher --password-stdin acraiacademy26.azurecr.io
      - run: docker push acraiacademy26.azurecr.io/team-c-pending-backend:${{ github.sha }}
 
